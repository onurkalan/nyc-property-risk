version: 2

models:
  - name: stg_pluto
    description: Typed and cleaned PLUTO lots. One row per tax lot (BBL).
    columns:
      - name: bbl
        description: 10-digit borough-block-lot identifier, zero-padded.
        tests:
          - not_null
          - unique
      - name: borough_code
        description: 1 Manhattan, 2 Bronx, 3 Brooklyn, 4 Queens, 5 Staten Island.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1', '2', '3', '4', '5']
      - name: block
        tests:
          - not_null
      - name: lot
        tests:
          - not_null
      - name: residential_units
        description: Residential units on the lot.
      - name: year_built
        description: Year built; zero values in the source are treated as unknown.

  - name: stg_dob_violations
    description: >
      Buildings Department (BIS) violations, one row per violation. Open/closed and
      risk flags are parsed from the violation_category prefix ('*' = closed,
      W = work without permit, H = hazardous).
    columns:
      - name: violation_id
        description: isn_dob_bis_viol, the source's unique violation key.
        tests:
          - not_null
          - unique
      - name: bbl
        description: Built from boro + block + lot. Null when block/lot are missing (~1% of rows).
      - name: issue_date
        description: Parsed from YYYYMMDD; impossible dates are null.
      - name: is_open
        description: True when the category prefix has no '*'.
        tests:
          - not_null

  - name: stg_ecb_violations
    description: >
      ECB violations issued by Buildings, with penalties. severity_level normalizes the
      old (Hazardous/Non-Hazardous) and new (CLASS 1/2/3) schemes to high/medium/low.
    columns:
      - name: ecb_record_id
        description: isn_dob_bis_extract, the source record key.
        tests:
          - not_null
          - unique
      - name: is_open
        tests:
          - not_null
      - name: severity_level
        tests:
          - accepted_values:
              arguments:
                values: ['high', 'medium', 'low', 'unknown']
      - name: balance_due
        description: Unpaid penalty in dollars; unpaid ECB balances can become liens.

  - name: stg_dobnow_approved_permits
    description: >
      DOB NOW work permits, one row per permit, sequence (renewal) number and work type. The applicant
      is the licensed contractor.
    columns:
      - name: work_permit
        tests:
          - not_null
      - name: contractor_license_number
        description: Applicant license number; key for contractor vetting.

  - name: stg_hpd_violations
    description: HPD housing code violations. Class C = immediately hazardous; I = information order.
    columns:
      - name: violation_id
        tests: [not_null, unique]
      - name: is_open
        tests: [not_null]
      - name: severity_level
        tests:
          - accepted_values:
              arguments:
                values: ['high', 'medium', 'low', 'info', 'unknown']

  - name: stg_hpd_registrations
    description: >
      HPD multiple-dwelling registrations (3+ unit buildings). Grain is registration +
      building: the source reuses a few registration IDs across two buildings (3 in Brooklyn).
    columns:
      - name: hpd_registration_id
        tests:
          - not_null
          - unique:
              config:
                severity: warn
                error_if: '>100'

  - name: stg_hpd_registration_contacts
    description: >
      Owners, officers and agents on HPD registrations (citywide). The source contact ID
      is reused for ~0.2% of rows, so contact_row_key (hash of the row) is the unique key.
    columns:
      - name: contact_row_key
        tests: [not_null, unique]
      - name: registration_contact_id
        tests:
          - not_null
          - unique:
              config:
                severity: warn
                error_if: '>2500'
      - name: contact_type
        tests: [not_null]

  - name: stg_acris_master
    description: ACRIS recorded documents, one row per document.
    columns:
      - name: document_id
        tests: [not_null, unique]
      - name: doc_type
        tests: [not_null]

  - name: stg_acris_legals
    description: ACRIS document-to-lot links, one row per document and lot.
    columns:
      - name: document_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_acris_master')
                field: document_id
              config:
                severity: warn
